<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client?hl=pt-BR" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100 e crie uma figura assinada com o e-mail da sua conta Google.</p>
    </header>

    <section class="login" aria-label="Login com Google">
      <p id="estadoLogin" role="status">Preparando o login com Google…</p>
      <div id="botaoGoogle"></div>
      <button id="sair" class="secundario" type="button" hidden>Sair da conta neste site</button>
    </section>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="numero">Número de 1 a 100</label>
        <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42" aria-describedby="dicaNumero">
      </div>
      <button id="gerar" type="submit">Desenhar</button>
      <p id="dicaNumero">Cada número cria uma figura diferente.</p>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-label="Desenho gerado" aria-live="polite"></figure>

    <button id="baixar" class="secundario" type="button" hidden>Baixar SVG</button>
    <noscript>Ative o JavaScript para entrar com Google e gerar seu desenho.</noscript>
  </main>

</body>
</html>
